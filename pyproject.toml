[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-calc"
version = "0.1.0"
description = "A source-checked, executable atlas of algebra and calculus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{name = "thebrazenbeard"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
calc-atlas = "calc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

